name: Container checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: docker pull node:22-alpine
      - run: node --import tsx --test tests/docker.test.ts
        env:
          PROOFPATCH_DOCKER_TEST: '1'
      - run: docker build -t proofpatch:test .
      - run: docker run --rm proofpatch:test demo
