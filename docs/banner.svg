<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="470" viewBox="0 0 1280 470" role="img" aria-labelledby="title desc"><title id="title">ProofPatch</title><desc id="desc">Executable evidence for every diff. Inspect the promise. Reproduce the failure. Keep the receipt.</desc><defs><pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".8" fill="#243840"/></pattern><linearGradient id="glow"><stop stop-color="#152b29"/><stop offset="1" stop-color="#0c141b"/></linearGradient></defs><rect width="1280" height="470" rx="24" fill="#0c141b"/><rect x="640" width="640" height="470" fill="url(#grid)"/><circle cx="1160" cy="65" r="250" fill="#9cf5cc" opacity=".025"/><path d="M56 80h29v29H56z" fill="#9cf5cc" rx="6"/><path d="m64 96 5 5 9-14" fill="none" stroke="#14271f" stroke-width="3"/><text x="100" y="100" font-family="Arial,sans-serif" font-size="15" letter-spacing="3" fill="#9caeaf">OPEN SOURCE / LOCAL FIRST / NO API KEYS</text><text x="54" y="205" font-family="Arial,sans-serif" font-size="83" font-weight="700" letter-spacing="-5" fill="#e8efeb">proofpatch</text><text x="58" y="267" font-family="Georgia,serif" font-size="36" font-style="italic" fill="#9cf5cc">Every diff deserves evidence.</text><text x="58" y="319" font-family="Arial,sans-serif" font-size="16" fill="#8ea4ac">Inspect the promise. Reproduce the failure. Keep the receipt.</text><rect x="58" y="372" width="212" height="36" rx="7" fill="#18382c" stroke="#315f49"/><text x="77" y="395" font-family="monospace" font-size="14" fill="#9cf5cc">$ npm run demo ↗</text><rect x="764" y="114" width="439" height="264" rx="14" fill="url(#glow)" stroke="#32474b"/><circle cx="788" cy="139" r="4" fill="#ff9985"/><circle cx="804" cy="139" r="4" fill="#c6b788"/><circle cx="820" cy="139" r="4" fill="#9cf5cc"/><text x="1178" y="143" text-anchor="end" font-family="monospace" font-size="10" fill="#8ca3a9">PATCH RECEIPT / 001</text><path d="M764 159h439" stroke="#2a3b43"/><text x="788" y="192" font-family="monospace" font-size="11" letter-spacing="2" fill="#ff9985">COUNTEREXAMPLE FOUND</text><text x="788" y="224" font-family="Arial,sans-serif" font-size="19" fill="#e8efeb">Disabled account. Valid token.</text><text x="788" y="255" font-family="monospace" font-size="14" fill="#9ebeea">canRefresh(false, true)</text><rect x="788" y="278" width="183" height="58" rx="7" fill="#0c171c" stroke="#263b3e"/><rect x="986" y="278" width="191" height="58" rx="7" fill="#1b2020" stroke="#56403b"/><text x="801" y="297" font-family="monospace" font-size="9" fill="#8ba19e">BEFORE</text><text x="801" y="322" font-family="monospace" font-size="20" fill="#9cf5cc">false</text><text x="1000" y="297" font-family="monospace" font-size="9" fill="#ac9690">AFTER</text><text x="1000" y="322" font-family="monospace" font-size="20" fill="#ff9985">true</text><text x="788" y="360" font-family="monospace" font-size="10" fill="#8ca3a9">FINITE EVIDENCE. VISIBLE LIMITS. YOUR CODE.</text></svg>
